<text x="462" y="361.2" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#1b1f24">первая транзакция c / fence.enter:</text>
