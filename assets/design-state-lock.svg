<text x="462" y="129.3" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#1b1f24">последняя эпоха сохранена</text>
