<text x="892" y="346.8" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#1b1f24">    проверить и откатить</text>
<rect x="800" y="60" width="320" height="100" rx="2" fill="#fff" stroke="#5b636c" stroke-width="1.1" stroke-dasharray="5 3"/>
<text x="814" y="80.1" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#5b636c">Смена мастера Redis (новый master_replid):</text>
<text x="814" y="95.0" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#5b636c">поколение g := nextval(fence.generation_seq).</text>
<text x="814" y="110.0" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#5b636c">Эпохи (g, c) сравниваются сначала по g,</text>
<text x="814" y="124.9" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#5b636c">потом по c, поэтому не убывают при потере</text>
<text x="814" y="139.9" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#5b636c">данных Redis.</text>
