<text x="462" y="392.4" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#1b1f24">запись с меньшей или чужой эпохой /</text>
<text x="462" y="408.0" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#1b1f24">    отклонить (40001)</text>
