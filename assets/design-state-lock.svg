<text x="310" y="455.8" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#a3322a">в режиме protect записи отклоняются</text>
